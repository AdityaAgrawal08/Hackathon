<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBITER — Vendor Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; font-weight: 600; }
    .header .nav { display: flex; gap: 16px; }
    .header .nav a { color: #94a3b8; text-decoration: none; font-size: 14px; }
    .header .nav a:hover { color: #e2e8f0; }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .stat-label { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-value.green { color: #22c55e; }
    .stat-value.red { color: #ef4444; }
    .stat-value.blue { color: #3b82f6; }
    .stat-value.yellow { color: #eab308; }
    .stat-value.purple { color: #a855f7; }
    .section { margin-bottom: 32px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-size: 18px; font-weight: 600; }
    .badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .badge-count { background: #ef4444; color: white; }
    .badge-live { background: #22c55e; color: white; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .table-container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #0f172a; padding: 12px 16px; text-align: left; font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #334155; }
    td { padding: 12px 16px; border-bottom: 1px solid #1e293b; font-size: 14px; }
    tr:hover { background: #334155; }
    .status { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .status-captured { background: #052e16; color: #86efac; }
    .status-failed { background: #450a0a; color: #fca5a5; }
    .status-pending { background: #422006; color: #fde047; }
    .action-btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-approve { background: #16a34a; color: white; }
    .btn-approve:hover { background: #15803d; }
    .btn-reject { background: #dc2626; color: white; }
    .btn-reject:hover { background: #b91c1c; }
    .btn-disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .alert-card { background: #1e293b; border: 1px solid #ef4444; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .alert-card .alert-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .alert-card .alert-title { font-weight: 600; color: #fca5a5; }
    .alert-card .alert-reasons { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
    .alert-card .alert-actions { display: flex; gap: 8px; }
    .empty-state { text-align: center; padding: 40px; color: #64748b; }
    .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 8px; animation: pulse 2s infinite; }
    .filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
    .filter-row select { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
    .filter-row select:focus { outline: none; border-color: #3b82f6; }
    .method-pill { display: inline-flex; align-items: center; gap: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
    .method-icon { font-size: 14px; }
    .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
    .method-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 16px; text-align: center; }
    .method-card .mc-icon { font-size: 28px; margin-bottom: 6px; }
    .method-card .mc-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .method-card .mc-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ARBITER — Vendor Dashboard</h1>
    <div class="nav">
      <a href="/store">Store</a>
      <a href="/dashboard">Dashboard</a>
    </div>
  </div>
  <div class="container">
    <div class="stats" id="stats"></div>
    <div class="section" id="method-section">
      <div class="section-title" style="margin-bottom:8px;">Payment Methods</div>
      <div class="method-grid" id="method-grid"></div>
    </div>

    <div class="section" id="alerts-section" style="display:none;">
      <div class="section-header">
        <span class="section-title">Suspicious Activity</span>
        <span class="badge badge-count" id="alert-count">0</span>
      </div>
      <div id="alerts-container"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title"><span class="live-dot"></span> Live Payment Feed</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <select id="method-filter" onchange="filterPayments()">
            <option value="all">All Methods</option>
            <option value="card">Card</option>
            <option value="upi">UPI</option>
            <option value="netbanking">Netbanking</option>
            <option value="wallet">Wallet</option>
          </select>
          <span class="badge badge-live">LIVE</span>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Customer</th>
              <th>Product</th>
              <th>Amount</th>
              <th>Payment Method</th>
              <th>Status</th>
              <th>Failure Class</th>
              <th>ML Probability</th>
            </tr>
          </thead>
          <tbody id="payments-body"></tbody>
        </table>
        <div class="empty-state" id="no-payments">No payment events yet. Waiting for transactions...</div>
      </div>
    </div>
  </div>

  <script>
    function formatINR(paise) {
      return '₹' + (paise / 100).toLocaleString('en-IN');
    }

    function formatTime(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    const METHOD_META = {
      card:       { icon: '💳', label: 'Card' },
      upi:        { icon: '📱', label: 'UPI' },
      netbanking: { icon: '🏦', label: 'Netbanking' },
      wallet:     { icon: '👛', label: 'Wallet' },
    };
    function formatMethod(p) {
      const raw = (p.payment_method || '').toLowerCase();
      if (raw === 'card') {
        const net = p.card_network || '';
        const last4 = p.card_last4 || '';
        return `<span class="method-pill"><span class="method-icon">💳</span>${net ? net + ' ' : ''}${last4 ? '****' + last4 : ''}</span>`;
      }
      if (METHOD_META[raw]) {
        const m = METHOD_META[raw];
        return `<span class="method-pill"><span class="method-icon">${m.icon}</span>${m.label}</span>`;
      }
      return '<span class="method-pill" style="color:#64748b">—</span>';
    }

    let allPayments = [];

    async function loadAnalytics() {
      try {
        const res = await fetch('/api/vendor/analytics');
        const data = await res.json();
        document.getElementById('stats').innerHTML = `
          <div class="stat-card"><div class="stat-label">Total Events</div><div class="stat-value blue">${data.totalEvents}</div></div>
          <div class="stat-card"><div class="stat-label">Successful</div><div class="stat-value green">${data.totalSuccesses}</div></div>
          <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value red">${data.totalFailures}</div></div>
          <div class="stat-card"><div class="stat-label">Recovered</div><div class="stat-value green">${formatINR(data.recoveredPaise)}</div></div>
          <div class="stat-card"><div class="stat-label">At Risk</div><div class="stat-value yellow">${formatINR(data.atRiskPaise)}</div></div>
          <div class="stat-card"><div class="stat-label">Suspicious</div><div class="stat-value red">${data.suspiciousCount}</div></div>
        `;
        const total = data.totalEvents || 1;
        document.getElementById('method-grid').innerHTML = `
          <div class="method-card"><div class="mc-icon">💳</div><div class="mc-label">Card</div><div class="mc-value blue">${data.methodCard}</div><div class="mc-label" style="margin-top:2px;">${((data.methodCard/total)*100).toFixed(0)}%</div></div>
          <div class="method-card"><div class="mc-icon">📱</div><div class="mc-label">UPI</div><div class="mc-value green">${data.methodUpi}</div><div class="mc-label" style="margin-top:2px;">${((data.methodUpi/total)*100).toFixed(0)}%</div></div>
          <div class="method-card"><div class="mc-icon">🏦</div><div class="mc-label">Netbanking</div><div class="mc-value yellow">${data.methodNetbanking}</div><div class="mc-label" style="margin-top:2px;">${((data.methodNetbanking/total)*100).toFixed(0)}%</div></div>
          <div class="method-card"><div class="mc-icon">👛</div><div class="mc-label">Wallet</div><div class="mc-value purple">${data.methodWallet}</div><div class="mc-label" style="margin-top:2px;">${((data.methodWallet/total)*100).toFixed(0)}%</div></div>
        `;
      } catch (e) {
        document.getElementById('stats').innerHTML = '<div class="stat-card"><div class="stat-label">Error</div><div class="stat-value red">Unable to load analytics</div></div>';
      }
    }

    function filterPayments() {
      const filter = document.getElementById('method-filter').value;
      const tbody = document.getElementById('payments-body');
      const filtered = filter === 'all' ? allPayments : allPayments.filter(p => (p.payment_method || '').toLowerCase() === filter);
      renderPayments(filtered);
    }

    function renderPayments(data) {
      const tbody = document.getElementById('payments-body');
      const noPayments = document.getElementById('no-payments');
      if (data.length === 0) { tbody.innerHTML = ''; noPayments.style.display = 'block'; return; }
      noPayments.style.display = 'none';
      tbody.innerHTML = data.map(p => `
        <tr>
          <td>${formatTime(p.created_at_utc)}</td>
          <td>${p.customer_name || '—'}</td>
          <td>${p.product_name || '—'}</td>
          <td>${formatINR(p.amount_paise)}</td>
          <td>${formatMethod(p)}</td>
          <td><span class="status status-${p.status}">${p.status}</span></td>
          <td>${p.failure_class || '—'}</td>
          <td>${p.ml_probability ? (p.ml_probability * 100).toFixed(1) + '%' : '—'}</td>
        </tr>
      `).join('');
    }

    async function loadPayments() {
      try {
        const res = await fetch('/api/vendor/payments');
        allPayments = await res.json();
        filterPayments();
      } catch (e) {
        document.getElementById('no-payments').style.display = 'block';
        document.getElementById('no-payments').textContent = 'Unable to load payment data';
      }
    }

    async function loadAlerts() {
      try {
        const res = await fetch('/api/vendor/alerts');
        const data = await res.json();
        const container = document.getElementById('alerts-container');
        const section = document.getElementById('alerts-section');
        const countBadge = document.getElementById('alert-count');

        if (data.length === 0) { section.style.display = 'none'; return; }
        section.style.display = 'block';
        countBadge.textContent = data.length;

        container.innerHTML = data.map(p => `
          <div class="alert-card" id="alert-${p.id}">
            <div class="alert-header">
              <span class="alert-title">Suspicious Payment — ${p.customer_name}</span>
              <span>${formatTime(p.created_at_utc)}</span>
            </div>
            <div class="alert-reasons">
              <strong>Amount:</strong> ${formatINR(p.amount_paise)} | <strong>Failure:</strong> ${p.failure_code || 'Unknown'}
              <br><strong>Reasons:</strong> First transaction, high amount, or Razorpay risk flag
            </div>
            <div class="alert-actions">
              <button class="action-btn btn-approve" onclick="decide('${p.id}', 'approved')">Approve & Send Recovery</button>
              <button class="action-btn btn-reject" onclick="decide('${p.id}', 'rejected')">Reject</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('alerts-section').style.display = 'block';
        document.getElementById('alerts-container').innerHTML = '<p style="color:#94a3b8">Unable to load alerts</p>';
      }
    }

    async function decide(eventId, decision) {
      try {
        await fetch('/api/vendor/decision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ eventId, decision }),
        });
        document.getElementById(`alert-${eventId}`)?.remove();
        loadAlerts();
        loadAnalytics();
        loadPayments();
      } catch (e) {
        console.error('Decision failed:', e);
      }
    }

    // SSE for real-time updates
    function connectSSE() {
      const evtSource = new EventSource('/api/sse/global');
      evtSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.type === 'PAYMENT_FAILED' || data.type === 'PAYMENT_RECEIVED' || data.type === 'VENDOR_DECISION') {
          loadPayments();
          loadAnalytics();
          loadAlerts();
        }
      };
      evtSource.onerror = function() { setTimeout(connectSSE, 5000); };
    }

    loadAnalytics();
    loadPayments();
    loadAlerts();
    connectSSE();
  </script>
</body>
</html>
