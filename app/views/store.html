<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBITER Store</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .header .badge { background: #2563eb; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .section-title { font-size: 24px; font-weight: 600; margin-bottom: 24px; color: #f8fafc; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-bottom: 48px; }
    .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; cursor: pointer; }
    .product-card:hover { border-color: #2563eb; transform: translateY(-2px); }
    .product-card.selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3); }
    .product-image { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
    .product-info { padding: 20px; }
    .product-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
    .product-desc { font-size: 14px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
    .product-price { font-size: 24px; font-weight: 700; color: #22c55e; }
    .product-price .currency { font-size: 16px; font-weight: 500; }
    .checkout-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 500px; }
    .checkout-section h2 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f8fafc; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; color: #94a3b8; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; font-size: 16px; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    .form-group input::placeholder { color: #64748b; }
    .pay-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .pay-btn:hover { background: #1d4ed8; }
    .pay-btn:disabled { background: #475569; cursor: not-allowed; }
    .pay-btn .amount { font-weight: 700; }
    .error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-top: 16px; display: none; }
    .success { background: #052e16; border: 1px solid #14532d; color: #86efac; padding: 12px 16px; border-radius: 8px; margin-top: 16px; display: none; }
    .no-product { text-align: center; padding: 40px; color: #64748b; }
    @media (max-width: 640px) { .products { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>ARBITER</h1>
    <span class="badge">Test Mode</span>
  </div>
  <div class="container">
    <h2 class="section-title">Select a Plan</h2>
    <div class="products" id="products"></div>

    <div class="checkout-section" id="checkout-section" style="display: none;">
      <h2>Complete Your Purchase</h2>
      <div id="selected-product" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #334155;"></div>
      <form id="checkout-form">
        <div class="form-group">
          <label for="customer-name">Full Name</label>
          <input type="text" id="customer-name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="customer-phone">Phone Number</label>
          <input type="tel" id="customer-phone" placeholder="+91 98765 43210" required>
        </div>
        <div class="form-group">
          <label for="customer-email">Email Address</label>
          <input type="email" id="customer-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="pay-btn" id="pay-btn">
          Pay <span class="amount" id="pay-amount"></span>
        </button>
      </form>
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg"></div>
    </div>

    <div class="no-product" id="no-product" style="display: none;">
      <p>Select a product above to continue.</p>
    </div>
  </div>

  <script>
    const PRODUCTS = [
      { id: "prod_premium_plan", name: "Premium Annual Plan", description: "Full access to all features for 12 months", pricePaise: 499900 },
      { id: "prod_monthly_basic", name: "Monthly Basic", description: "Essential features, billed monthly", pricePaise: 99900 },
      { id: "prod_team_license", name: "Team License (5 seats)", description: "Collaborate with your team, 5 user seats", pricePaise: 199900 },
      { id: "prod_enterprise", name: "Enterprise (Custom)", description: "Custom solution for large organizations", pricePaise: 999900 },
    ];

    let selectedProduct = null;

    function formatINR(paise) {
      return '₹' + (paise / 100).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = PRODUCTS.map(p => `
        <div class="product-card" data-id="${p.id}" onclick="selectProduct('${p.id}')">
          <div style="height:160px;background:linear-gradient(135deg,#1e293b,#334155);display:flex;align-items:center;justify-content:center;">
            <span style="font-size:48px;color:#64748b;">${p.id.includes('premium') ? '★' : p.id.includes('basic') ? '◆' : p.id.includes('team') ? '⬡' : '⬢'}</span>
          </div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.description}</div>
            <div class="product-price"><span class="currency">₹</span>${(p.pricePaise / 100).toLocaleString('en-IN')}</div>
          </div>
        </div>
      `).join('');
    }

    function selectProduct(productId) {
      selectedProduct = PRODUCTS.find(p => p.id === productId);
      document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.product-card[data-id="${productId}"]`).classList.add('selected');

      document.getElementById('checkout-section').style.display = 'block';
      document.getElementById('no-product').style.display = 'none';

      document.getElementById('selected-product').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:600;color:#f8fafc;">${selectedProduct.name}</div>
            <div style="font-size:14px;color:#94a3b8;">${selectedProduct.description}</div>
          </div>
          <div style="font-size:20px;font-weight:700;color:#22c55e;">₹${(selectedProduct.pricePaise / 100).toLocaleString('en-IN')}</div>
        </div>
      `;
      document.getElementById('pay-amount').textContent = '₹' + (selectedProduct.pricePaise / 100).toLocaleString('en-IN');
    }

    document.getElementById('checkout-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selectedProduct) return;

      const name = document.getElementById('customer-name').value.trim();
      const phone = document.getElementById('customer-phone').value.trim();
      const email = document.getElementById('customer-email').value.trim();

      if (!name || !phone || !email) {
        showError('Please fill in all fields.');
        return;
      }

      const payBtn = document.getElementById('pay-btn');
      payBtn.disabled = true;
      payBtn.textContent = 'Creating order...';

      try {
        const response = await fetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: selectedProduct.id,
            customerName: name,
            customerPhone: phone,
            customerEmail: email,
          }),
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to create order');

        const options = {
          key: data.keyId,
          amount: data.amountPaise,
          currency: data.currency,
          name: 'ARBITER',
          description: selectedProduct.name,
          order_id: data.orderId,
          handler: async function(response) {
            try {
              const verifyRes = await fetch('/api/payments/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_signature: response.razorpay_signature,
                  orderId: data.orderId,
                }),
              });
              const verifyData = await verifyRes.json();
              if (verifyData.success) {
                showSuccess('Payment successful! Your order has been confirmed.');
              } else {
                showError('Payment verification failed. Please contact support.');
              }
            } catch (err) {
              showError('Payment completed but verification pending. We will confirm shortly.');
            }
          },
          prefill: {
            name: name,
            email: email,
            contact: phone,
          },
          theme: {
            color: '#2563eb',
          },
          modal: {
            ondismiss: function() {
              payBtn.disabled = false;
              payBtn.innerHTML = 'Pay <span class="amount">' + '₹' + (selectedProduct.pricePaise / 100).toLocaleString('en-IN') + '</span>';
            },
          },
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', async function(response) {
          const err = response.error || {};
          const errorCode = err.code || 'PAYMENT_FAILED';
          const errorDesc = err.description || 'Payment could not be processed';
          const errorStep = err.step || '';
          const errorSource = err.source || '';
          const errorReason = err.reason || '';

          showError('Payment failed: ' + errorDesc);
          payBtn.disabled = false;
          payBtn.innerHTML = 'Pay <span class="amount">' + '₹' + (selectedProduct.pricePaise / 100).toLocaleString('en-IN') + '</span>';

          // Report failure to server and redirect to recovery page
          try {
            const failRes = await fetch('/api/payments/failed', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_order_id: data.orderId,
                error_code: errorCode,
                error_description: errorDesc,
                error_step: errorStep,
                error_source: errorSource,
                error_reason: errorReason,
                customerId: data.customerId,
                productId: selectedProduct.id,
                productName: selectedProduct.name,
                amountPaise: data.amountPaise,
              }),
            });
            const failData = await failRes.json();
            if (failData.eventId) {
              // Pass failure details to recovery page via URL params
              const params = new URLSearchParams({
                reason: failData.failureDescription || errorDesc,
                class: failData.failureClass || 'UNKNOWN',
                code: failData.failureCode || errorCode,
              });
              window.location.href = '/recover/' + failData.eventId + '?' + params.toString();
            }
          } catch (e) {
            window.location.href = '/recover/' + data.orderId;
          }
        });
        rzp.open();
      } catch (err) {
        showError(err.message);
        payBtn.disabled = false;
        payBtn.innerHTML = 'Pay <span class="amount">' + '₹' + (selectedProduct.pricePaise / 100).toLocaleString('en-IN') + '</span>';
      }
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }

    renderProducts();
  </script>
</body>
</html>
