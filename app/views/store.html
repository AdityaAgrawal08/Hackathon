<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBITER Store</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
    .header .badge { background: #2563eb; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .section-title { font-size: 24px; font-weight: 600; margin-bottom: 24px; color: #f8fafc; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-bottom: 48px; }
    .product-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; cursor: pointer; }
    .product-card:hover { border-color: #2563eb; transform: translateY(-2px); }
    .product-card.selected { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3); }
    .product-image { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
    .product-info { padding: 20px; }
    .product-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
    .product-desc { font-size: 14px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
    .product-price { font-size: 24px; font-weight: 700; color: #22c55e; }
    .product-price .currency { font-size: 16px; font-weight: 500; }
    .checkout-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 500px; }
    .checkout-section h2 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #f8fafc; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; color: #94a3b8; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; font-size: 16px; transition: border-color 0.2s; }
    .form-group input:focus { outline: none; border-color: #2563eb; }
    .form-group input::placeholder { color: #64748b; }
    .pay-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .pay-btn:hover { background: #1d4ed8; }
    .pay-btn:disabled { background: #475569; cursor: not-allowed; }
    .pay-btn .amount { font-weight: 700; }
    .error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; padding: 12px 16px; border-radius: 8px; margin-top: 16px; display: none; }
    .success { background: #052e16; border: 1px solid #14532d; color: #86efac; padding: 12px 16px; border-radius: 8px; margin-top: 16px; display: none; }
    .no-product { text-align: center; padding: 40px; color: #64748b; }
    @media (max-width: 640px) { .products { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px;">
      <h1>ARBITER</h1>
      <span class="badge">Track 3 Multi-Domain</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <a href="/store" style="color:#60a5fa;text-decoration:none;font-size:14px;font-weight:600;">Store Demo</a>
      <a href="/dashboard" style="color:#94a3b8;text-decoration:none;font-size:14px;">Merchant Dashboard</a>
    </div>
  </div>

  <div style="background:#1e293b;border-bottom:1px solid #334155;padding:12px 24px;">
    <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;gap:8px;" id="domain-switcher-tabs">
        <button class="domain-tab active" id="tab-d2c" onclick="switchDomain('d2c')" style="background:#2563eb;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">🛒 D2C Consumer Checkout</button>
        <button class="domain-tab" id="tab-saas" onclick="switchDomain('saas')" style="background:#0f172a;color:#94a3b8;border:1px solid #334155;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">⚡ SaaS UPI Mandates (RBI 24h)</button>
        <button class="domain-tab" id="tab-b2b" onclick="switchDomain('b2b')" style="background:#0f172a;color:#94a3b8;border:1px solid #334155;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">🏢 B2B Invoices (2/10 Net 30)</button>
      </div>
      <div style="font-size:12px;color:#64748b;" id="domain-badge-desc">Simulates active consumer checkout drop-offs & 1-tap recovery</div>
    </div>
  </div>

  <div class="container">
    <h2 class="section-title" id="section-title">Select a Plan (D2C Checkout)</h2>
    <div class="products" id="products"></div>

    <div class="checkout-section" id="checkout-section" style="display: none;">
      <h2>Complete Your Purchase</h2>
      <div id="selected-product" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #334155;"></div>
      <form id="checkout-form">
        <div class="form-group">
          <label for="customer-name">Full Name</label>
          <input type="text" id="customer-name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="customer-phone">Phone Number</label>
          <div style="display:flex;align-items:center;gap:0;">
            <span style="padding:12px 12px;background:#1e293b;border:1px solid #475569;border-right:none;border-radius:8px 0 0 8px;color:#94a3b8;font-size:16px;white-space:nowrap;">+91</span>
            <input type="tel" id="customer-phone" placeholder="98765 43210" required maxlength="10" pattern="[0-9]{10}" style="border-radius:0 8px 8px 0;" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
          </div>
        </div>
        <div class="form-group">
          <label for="customer-email">Email Address</label>
          <input type="email" id="customer-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="pay-btn" id="pay-btn">
          Pay <span class="amount" id="pay-amount"></span>
        </button>
      </form>
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg"></div>
    </div>

    <div class="no-product" id="no-product" style="display: none;">
      <p>Select a product above to continue.</p>
    </div>
  </div>

  <script>
  <script>
    const DOMAIN_DATA = {
      d2c: {
        title: "Select a Plan (D2C Consumer Checkout)",
        badge: "Simulates consumer checkout drop-offs, abandoned carts & 1-tap recovery",
        products: [
          { id: "prod_premium_plan", name: "Premium Annual Plan", description: "Full access to all features for 12 months", pricePaise: 499900 },
          { id: "prod_monthly_basic", name: "Monthly Basic", description: "Essential features, billed monthly", pricePaise: 99900 },
          { id: "prod_team_license", name: "Team License (5 seats)", description: "Collaborate with your team, 5 user seats", pricePaise: 199900 },
          { id: "prod_enterprise", name: "Enterprise (Custom)", description: "Custom solution for large organizations", pricePaise: 999900 },
        ]
      },
      saas: {
        title: "Select a Subscription (SaaS Mandate Auto-Debit)",
        badge: "Simulates UPI Autopay / eNACH recurring debits with strict RBI 24h pre-debit notice",
        products: [
          { id: "mandate_cloud_pro", name: "Cloud Infrastructure Pro", description: "Monthly recurring UPI Autopay mandate", pricePaise: 299900 },
          { id: "mandate_saas_annual", name: "SaaS Enterprise Autopay", description: "Annual eNACH recurring mandate with 06:30 AM retry window", pricePaise: 1299900 },
          { id: "mandate_starter", name: "Developer Starter Mandate", description: "Fixed ₹499/mo subscription mandate", pricePaise: 49900 },
        ]
      },
      b2b: {
        title: "Select B2B Receivables (2/10 Net 30 Terms)",
        badge: "Simulates B2B corporate invoices, automated early settlement discounts & DSO chasers",
        products: [
          { id: "inv_software_retainer", name: "Enterprise Custom Retainer", description: "Net 30 invoice with ₹3,000 instant discount if paid in 10 days", pricePaise: 15000000 },
          { id: "inv_infra_sla", name: "Annual Dedicated Infrastructure SLA", description: "2/10 Net 30 terms saving ₹8,500 on early settlement", pricePaise: 42500000 },
          { id: "inv_api_usage", name: "Monthly Volume API Usage", description: "Corporate receivable with automated WhatsApp/Email chaser", pricePaise: 8500000 },
        ]
      }
    };

    let currentDomain = 'd2c';
    let selectedProduct = null;

    function formatINR(paise) {
      return '₹' + (paise / 100).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function switchDomain(domain) {
      currentDomain = domain;
      document.querySelectorAll('.domain-tab').forEach(b => {
        b.style.background = '#0f172a';
        b.style.color = '#94a3b8';
        b.style.border = '1px solid #334155';
      });
      const activeBtn = document.getElementById('tab-' + domain);
      if (activeBtn) {
        activeBtn.style.background = '#2563eb';
        activeBtn.style.color = 'white';
        activeBtn.style.border = 'none';
      }

      const data = DOMAIN_DATA[domain] || DOMAIN_DATA.d2c;
      document.getElementById('section-title').textContent = data.title;
      document.getElementById('domain-badge-desc').textContent = data.badge;
      document.getElementById('checkout-section').style.display = 'none';
      selectedProduct = null;
      renderProducts();
    }

    function renderProducts() {
      const data = DOMAIN_DATA[currentDomain] || DOMAIN_DATA.d2c;
      const container = document.getElementById('products');
      container.innerHTML = data.products.map(p => `
        <div class="product-card" data-id="${p.id}" onclick="selectProduct('${p.id}')">
          <div style="height:160px;background:linear-gradient(135deg,#1e293b,#334155);display:flex;align-items:center;justify-content:center;">
            <span style="font-size:48px;color:#64748b;">${p.id.includes('cloud') || p.id.includes('mandate') ? '⚡' : p.id.includes('inv') ? '🏢' : '🛒'}</span>
          </div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.description}</div>
            <div class="product-price"><span class="currency">₹</span>${(p.pricePaise / 100).toLocaleString('en-IN')}</div>
          </div>
        </div>
      `).join('');
    }

    function selectProduct(productId) {
      const data = DOMAIN_DATA[currentDomain] || DOMAIN_DATA.d2c;
      selectedProduct = data.products.find(p => p.id === productId);
      document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
      const activeCard = document.querySelector(`.product-card[data-id="${productId}"]`);
      if (activeCard) activeCard.classList.add('selected');

      document.getElementById('checkout-section').style.display = 'block';
      document.getElementById('no-product').style.display = 'none';

      let buttonLabel = 'Pay ' + '₹' + (selectedProduct.pricePaise / 100).toLocaleString('en-IN');
      if (currentDomain === 'saas') {
        buttonLabel = '⚡ Setup Mandate & Simulate Failure (' + formatINR(selectedProduct.pricePaise) + ')';
      } else if (currentDomain === 'b2b') {
        buttonLabel = '🏢 Issue B2B Invoice & Calculate 2/10 Terms (' + formatINR(selectedProduct.pricePaise) + ')';
      }

      document.getElementById('selected-product').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:600;color:#f8fafc;">${selectedProduct.name}</div>
            <div style="font-size:14px;color:#94a3b8;">${selectedProduct.description}</div>
          </div>
          <div style="font-size:20px;font-weight:700;color:#22c55e;">₹${(selectedProduct.pricePaise / 100).toLocaleString('en-IN')}</div>
        </div>
      `;
      document.getElementById('pay-btn').textContent = buttonLabel;
    }

    document.getElementById('checkout-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!selectedProduct) return;

      const name = document.getElementById('customer-name').value.trim();
      const rawPhone = document.getElementById('customer-phone').value.trim();
      const phone = rawPhone.length === 10 ? '91' + rawPhone : rawPhone;
      const email = document.getElementById('customer-email').value.trim();

      if (!name || !phone || !email) {
        showError('Please fill in all fields.');
        return;
      }
      if (rawPhone.length !== 10 || !/^[0-9]{10}$/.test(rawPhone)) {
        showError('Please enter a valid 10-digit phone number.');
        return;
      }

      const payBtn = document.getElementById('pay-btn');
      payBtn.disabled = true;

      if (currentDomain === 'saas') {
        payBtn.textContent = 'Simulating UPI Autopay Debit Failure...';
        try {
          const res = await fetch('/api/mandates/auto-debit-failure', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              customerId: 'cust_saas_' + Date.now(),
              customerName: name,
              customerPhone: phone,
              customerEmail: email,
              mandateType: 'UPI_AUTOPAY',
              planName: selectedProduct.name,
              amountPaise: selectedProduct.pricePaise,
            }),
          });
          const d = await res.json();
          payBtn.disabled = false;
          payBtn.textContent = '⚡ Setup Mandate & Simulate Failure';
          if (d.success) {
            showSuccess(`✓ Mandate Auto-Debit Failure Ingested! Scheduled RBI Notice: ${d.mandate.pre_debit_notification_utc} | Next Retry: ${d.mandate.scheduled_debit_utc}`);
          } else {
            showError(d.error || 'Failed to trigger mandate failure');
          }
        } catch (err) {
          payBtn.disabled = false;
          showError('Network error while triggering mandate failure');
        }
        return;
      }

      if (currentDomain === 'b2b') {
        payBtn.textContent = 'Generating 2/10 Net 30 Invoice...';
        try {
          const res = await fetch('/api/invoices/chaser/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              invoiceNumber: 'INV-' + Math.floor(1000 + Math.random() * 9000),
              clientCompany: name + ' Technologies Pvt Ltd',
              contactEmail: email,
              contactPhone: phone,
              amountPaise: selectedProduct.pricePaise,
              dueDateUtc: new Date(Date.now() + 30 * 86400000).toISOString(),
            }),
          });
          const d = await res.json();
          payBtn.disabled = false;
          payBtn.textContent = '🏢 Issue B2B Invoice & Calculate 2/10 Terms';
          if (d.success) {
            showSuccess(`✓ B2B Invoice Issued! Early Settlement Discount: ₹${(d.chaserPlan.earlyDiscountPaise/100).toFixed(0)} (Pay by ${new Date(d.chaserPlan.earlySettlementDeadlineUtc).toLocaleDateString()}) | Merchant Cost Saved: ₹${(d.chaserPlan.workingCapitalCostSavingsPaise/100).toFixed(0)}`);
          } else {
            showError(d.error || 'Failed to issue B2B invoice');
          }
        } catch (err) {
          payBtn.disabled = false;
          showError('Network error while issuing invoice');
        }
        return;
      }

      payBtn.textContent = 'Creating order...';

      try {
        const response = await fetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: selectedProduct.id,
            customerName: name,
            customerPhone: phone,
            customerEmail: email,
          }),
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to create order');

        const options = {
          key: data.keyId,
          amount: data.amountPaise,
          currency: data.currency,
          name: 'ARBITER',
          description: selectedProduct.name,
          order_id: data.orderId,
          handler: async function(response) {
            try {
              const verifyRes = await fetch('/api/payments/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_signature: response.razorpay_signature,
                  orderId: data.orderId,
                }),
              });
              const verifyData = await verifyRes.json();
              if (verifyData.success) {
                showSuccess('Payment successful! Your order has been confirmed.');
              } else {
                showError('Payment verification failed. Please contact support.');
              }
            } catch (err) {
              showError('Payment completed but verification pending. We will confirm shortly.');
            }
          },
          prefill: {
            name: name,
            email: email,
            contact: phone,
          },
          theme: {
            color: '#2563eb',
          },
          modal: {
            ondismiss: function() {
              payBtn.disabled = false;
              payBtn.textContent = 'Pay ' + formatINR(selectedProduct.pricePaise);
            },
          },
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', async function(response) {
          const err = response.error || {};
          const errorCode = err.code || 'PAYMENT_FAILED';
          const errorDesc = err.description || 'Payment could not be processed';
          const errorStep = err.step || '';
          const errorSource = err.source || '';
          const errorReason = err.reason || '';

          // Extract payment method details from error metadata
          const errMetadata = err.metadata || {};
          const paymentMethod = errMetadata.payment_method || {};
          const methodType = paymentMethod.type || '';
          const methodLast4 = paymentMethod.last4 || '';
          const methodNetwork = paymentMethod.network || paymentMethod.card_network || '';
          const methodVpa = paymentMethod.vpa || '';
          const methodBank = paymentMethod.bank || paymentMethod.bank_name || '';

          // Immediately close Razorpay's built-in retry modal — we handle recovery ourselves
          try { rzp.close(); } catch (e) {}

          // Report failure to server and redirect to recovery page
          try {
            const failRes = await fetch('/api/payments/failed', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_order_id: data.orderId,
                error_code: errorCode,
                error_description: errorDesc,
                error_step: errorStep,
                error_source: errorSource,
                error_reason: errorReason,
                customerId: data.customerId,
                productId: selectedProduct.id,
                productName: selectedProduct.name,
                amountPaise: data.amountPaise,
                paymentMethod: {
                  type: methodType,
                  last4: methodLast4,
                  network: methodNetwork,
                  vpa: methodVpa,
                  bank: methodBank,
                },
              }),
            });
            const failData = await failRes.json();
            if (failData.eventId) {
              const methodParams = {};
              if (methodType) methodParams.method = methodType;
              if (methodLast4) methodParams.last4 = methodLast4;
              if (methodNetwork) methodParams.network = methodNetwork;
              if (methodVpa) methodParams.vpa = methodVpa;
              if (methodBank) methodParams.bank = methodBank;
              const params = new URLSearchParams({
                reason: failData.failureDescription || errorDesc,
                class: failData.failureClass || 'UNKNOWN',
                code: failData.failureCode || errorCode,
                product: selectedProduct.id,
                productName: selectedProduct.name,
                ...methodParams,
              });
              window.location.href = '/recover/' + failData.eventId + '?' + params.toString();
              return;
            }
          } catch (e) {}
          // Fallback: redirect to store with error
          showError('Payment failed. Redirecting...');
          setTimeout(function() { window.location.href = '/store'; }, 1500);
        });
        rzp.open();
      } catch (err) {
        showError(err.message);
        payBtn.disabled = false;
        payBtn.textContent = 'Pay ' + formatINR(selectedProduct.pricePaise);
      }
    });

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
    }

    renderProducts();
  </script>
</body>
</html>
