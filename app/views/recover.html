<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARBITER — Complete Your Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 40px; max-width: 440px; width: 100%; text-align: center; }
    .logo { font-size: 24px; font-weight: 700; letter-spacing: 1px; margin-bottom: 32px; color: #f8fafc; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
    .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
    .message-box { background: #0f172a; border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: left; }
    .message-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .message-text { font-size: 14px; line-height: 1.6; }
    .message-box.soft { border: 1px solid #166534; }
    .message-box.soft .message-label { color: #4ade80; }
    .message-box.soft .message-text { color: #bbf7d0; }
    .message-box.hard { border: 1px solid #92400e; }
    .message-box.hard .message-label { color: #fb923c; }
    .message-box.hard .message-text { color: #fed7aa; }
    .message-box.network { border: 1px solid #1e3a5f; }
    .message-box.network .message-label { color: #60a5fa; }
    .message-box.network .message-text { color: #bfdbfe; }
    .message-box.risk { border: 1px solid #7f1d1d; }
    .message-box.risk .message-label { color: #f87171; }
    .message-box.risk .message-text { color: #fecaca; }
    .message-box.unknown { border: 1px solid #555; }
    .message-box.unknown .message-label { color: #9ca3af; }
    .message-box.unknown .message-text { color: #d1d5db; }
    .amount-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .amount-label { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    .amount-value { font-size: 32px; font-weight: 700; color: #22c55e; margin-top: 4px; }
    .pay-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 12px; }
    .pay-btn:hover { background: #1d4ed8; }
    .pay-btn:disabled { background: #475569; cursor: not-allowed; }
    .salary-btn { width: 100%; padding: 14px; background: #f59e0b; color: #0f172a; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 16px; }
    .salary-btn:hover { background: #d97706; }
    .salary-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .status { display: none; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .status-success { background: #052e16; border: 1px solid #14532d; color: #86efac; display: block; }
    .status-error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; display: block; }
    .footer { margin-top: 24px; font-size: 12px; color: #64748b; }
    .success-view { display: none; }
    .success-view .icon { color: #22c55e; }
    .success-view .title { color: #22c55e; }
    .banner-offline { background: #854d0e; color: #fef3c7; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
    .timeline { text-align: left; margin: 16px 0; }
    .timeline-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .timeline-dot.done { background: #22c55e; }
    .timeline-dot.pending { background: #64748b; }
    .timeline-text { font-size: 13px; color: #94a3b8; }
    .timeline-text strong { color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="card" id="payment-card">
    <div class="banner-offline" id="banner-offline">You appear to be offline. Payment link will be sent via SMS.</div>
    <div class="logo">ARBITER</div>

    <!-- Failure View (default) -->
    <div id="failure-view">
      <div class="icon" id="main-icon">⚠</div>
      <div class="title" id="main-title">Payment Could Not Be Processed</div>
      <div class="subtitle" id="main-subtitle"></div>

      <div class="message-box" id="message-box">
        <div class="message-label" id="message-label">What happened</div>
        <div class="message-text" id="message-text">Loading details...</div>
      </div>

      <div class="amount-box">
        <div class="amount-label">Amount Due</div>
        <div class="amount-value" id="amount">—</div>
      </div>
      <button class="pay-btn" id="pay-btn" onclick="openCheckout()">Retry Payment Now</button>
      <button class="salary-btn" id="salary-btn" onclick="remindSalaryDay()">Remind Me on Salary Day</button>
      <div class="status" id="status"></div>
    </div>

    <!-- Success View -->
    <div class="success-view" id="success-view">
      <div class="icon">✓</div>
      <div class="title">Payment Successful!</div>
      <div class="subtitle">Your payment has been processed successfully. Thank you!</div>
      <div class="amount-box">
        <div class="amount-label">Amount Paid</div>
        <div class="amount-value" id="paid-amount">—</div>
      </div>
      <button class="pay-btn" onclick="window.location.href='/'">Back to Store</button>
    </div>

    <div class="footer">Secure payment powered by Razorpay</div>
  </div>

  <script>
    const eventId = window.location.pathname.split('/').pop();
    const params = new URLSearchParams(window.location.search);
    const proposalId = params.get('prop') || eventId;
    let orderData = null;
    let customerData = null;

    const failureClass = params.get('class') || 'UNKNOWN';
    const failureReason = params.get('reason') || '';
    const failureCode = params.get('code') || '';

    // ── Class-specific UI configuration ──────────────────────────
    const classConfig = {
      SOFT_RETRYABLE: {
        icon: '⚡',
        cssClass: 'soft',
        label: 'Temporary Issue',
        title: 'Payment Could Not Be Processed',
        subtitle: 'This looks like a temporary hiccup — your card or account may have had a brief issue. You can retry right now.',
        message: 'Your bank returned a temporary error. This usually resolves quickly. Try paying again, or we can remind you on your next payday.',
        button: 'Retry Payment Now',
        showSalary: true,
      },
      HARD_METHOD_DEAD: {
        icon: '🚫',
        cssClass: 'hard',
        label: 'Payment Method Issue',
        title: 'Your Payment Method Needs Attention',
        subtitle: 'Your card or UPI account may be expired, blocked, or invalid. Please update your details.',
        message: 'The payment method you used cannot process this transaction. This could mean your card expired, your UPI ID changed, or your bank blocked the charge.',
        button: 'Try a Different Method',
        showSalary: false,
      },
      NETWORK_TIMEOUT: {
        icon: '⏳',
        cssClass: 'network',
        label: 'Connection Timeout',
        title: 'Payment Timed Out',
        subtitle: 'The payment took too long to process — this is usually a temporary network issue.',
        message: 'Your bank or UPI provider didn\'t respond in time. This is often caused by slow internet or bank server load. Try again in a few minutes.',
        button: 'Retry Payment',
        showSalary: true,
      },
      RISK_FLAGGED: {
        icon: '🔒',
        cssClass: 'risk',
        label: 'Security Review',
        title: 'Payment Under Review',
        subtitle: 'This transaction was flagged for a security check. This is a precaution to protect your account.',
        message: 'Our system detected something unusual about this transaction. This is a standard security measure. If you believe this is an error, please contact support.',
        button: 'Contact Support',
        showSalary: false,
      },
      UNKNOWN: {
        icon: '❓',
        cssClass: 'unknown',
        label: 'Unexpected Error',
        title: 'Something Went Wrong',
        subtitle: 'We couldn\'t determine why your payment failed. Please try again or contact support.',
        message: 'An unexpected error occurred during payment processing. This could be a temporary issue with your bank or a system error.',
        button: 'Try Again',
        showSalary: true,
      },
    };

    const config = classConfig[failureClass] || classConfig['UNKNOWN'];

    // Apply class-specific UI
    document.getElementById('main-icon').textContent = config.icon;
    document.getElementById('main-title').textContent = config.title;
    document.getElementById('main-subtitle').textContent = config.subtitle;
    document.getElementById('pay-btn').textContent = config.button;

    const msgBox = document.getElementById('message-box');
    msgBox.className = 'message-box ' + config.cssClass;
    document.getElementById('message-label').textContent = config.label;
    document.getElementById('message-text').textContent = config.message;

    if (!config.showSalary) {
      document.getElementById('salary-btn').style.display = 'none';
    }

    async function loadOrder() {
      try {
        // Try to fetch actual proposal/event data first
        let realEventId = proposalId;
        if (realEventId && realEventId !== 'undefined') {
          let attempts = 0;
          while (attempts < 5) {
            try {
              const propRes = await fetch('/api/recovery/result/' + realEventId);
              if (propRes.ok) {
                customerData = await propRes.json();
                break;
              }
            } catch {}
            try {
              const orderRes = await fetch('/api/payments/by-order/' + realEventId);
              if (orderRes.ok) {
                const od = await orderRes.json();
                realEventId = od.eventId;
                const propRes2 = await fetch('/api/recovery/result/' + realEventId);
                if (propRes2.ok) {
                  customerData = await propRes2.json();
                  break;
                }
              }
            } catch {}
            attempts++;
            if (attempts < 5) await new Promise(r => setTimeout(r, 1000));
          }
          if (customerData?.customerName) {
            document.getElementById('main-subtitle').textContent =
              `Hi ${customerData.customerName}, ${config.subtitle.toLowerCase()}`;
          }
        }

        // Create a real Razorpay order for recovery payment
        const res = await fetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId: customerData?.productName || 'prod_premium_plan',
            customerName: customerData?.customerName || 'Customer',
            customerPhone: customerData?.phone || '+91 98765 43210',
            customerEmail: customerData?.email || 'customer@example.com',
          }),
        });
        orderData = await res.json();
        if (orderData.amountPaise) {
          document.getElementById('amount').textContent = '₹' + (orderData.amountPaise / 100).toLocaleString('en-IN');
        }
      } catch {
        document.getElementById('main-subtitle').textContent = 'Unable to load payment details. Please try again.';
      }
    }

    function openCheckout() {
      if (!orderData?.orderId) return;
      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      const options = {
        key: orderData.keyId,
        amount: orderData.amountPaise,
        currency: orderData.currency,
        name: 'ARBITER',
        description: 'Payment Recovery',
        order_id: orderData.orderId,
        handler: async function(response) {
          try {
            const verifyRes = await fetch('/api/payments/verify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_signature: response.razorpay_signature,
                orderId: orderData.orderId,
              }),
            });
            const verifyData = await verifyRes.json();
            if (verifyData.success) {
              document.getElementById('failure-view').style.display = 'none';
              document.getElementById('success-view').style.display = 'block';
              document.getElementById('paid-amount').textContent = '₹' + (orderData.amountPaise / 100).toLocaleString('en-IN');
            } else {
              document.getElementById('status').className = 'status status-error';
              document.getElementById('status').textContent = 'Payment verification pending. We will confirm shortly.';
            }
          } catch {
            document.getElementById('status').className = 'status status-success';
            document.getElementById('status').textContent = 'Payment received. Confirmation pending.';
          }
        },
        theme: { color: '#2563eb' },
        modal: {
          ondismiss: function() {
            btn.disabled = false;
            btn.textContent = config.button;
          },
        },
      };

      const rzp = new Razorpay(options);
      rzp.on('payment.failed', function(response) {
        document.getElementById('status').className = 'status status-error';
        document.getElementById('status').textContent = 'Payment failed: ' + (response.error.description || 'Please try again');
        btn.disabled = false;
        btn.textContent = config.button;
      });
      rzp.open();
    }

    loadOrder();

    window.addEventListener("offline", function() {
      document.getElementById('banner-offline').style.display = 'block';
    });
    window.addEventListener("online", function() {
      document.getElementById('banner-offline').style.display = 'none';
    });

    function remindSalaryDay() {
      const btn = document.getElementById('salary-btn');
      btn.disabled = true;
      btn.textContent = 'Scheduling...';

      fetch('/api/recovery/promise-to-pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposalId: proposalId || eventId, promisedDay: 28 }),
      }).then(res => res.json()).then(data => {
        if (data.success) {
          document.getElementById('status').className = 'status status-success';
          document.getElementById('status').textContent = 'We will remind you on your salary day (28th). Thank you!';
        } else {
          throw new Error(data.error || 'Failed');
        }
      }).catch(() => {
        document.getElementById('status').className = 'status status-success';
        document.getElementById('status').textContent = 'We will remind you on your salary day. Thank you!';
        btn.disabled = false;
        btn.textContent = 'Remind Me on Salary Day';
      });
    }
  </script>
</body>
</html>
