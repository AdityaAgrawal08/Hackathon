<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Checkout — ARBITER</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-real { background-color: #0284c7; color: white; }
    .badge-local { background-color: #7c3aed; color: white; }
    .banner {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .banner-offline {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--danger);
      color: #fca5a5;
      display: none;
    }
    .banner-status {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }
    .amount-display {
      font-size: 2rem;
      font-weight: 800;
      color: #60a5fa;
      margin: 0.5rem 0;
    }
    .btn-pay {
      background-color: var(--primary);
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background-color 0.2s;
    }
    .btn-pay:hover {
      background-color: var(--primary-hover);
    }
    .btn-pay:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .qr-section {
      text-align: center;
      margin: 1.5rem 0;
      padding: 1rem;
      background: #ffffff;
      border-radius: 12px;
      display: inline-block;
    }
    .qr-section img {
      width: 180px;
      height: 180px;
      display: block;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="checkout-card">
    <header style="text-align: center; margin-bottom: 1.5rem;">
      <h3 style="margin-bottom: 0.25rem; color: #ffffff;">Order Checkout</h3>
      <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">Order: <span id="lbl-order-id">{{ORDER_ID}}</span></p>
      <div class="amount-display" id="lbl-amount">₹{{AMOUNT_FORMATTED}}</div>

      <span id="lbl-mode" class="badge {{MODE_BADGE_CLASS}}">{{PAYMENT_MODE}}</span>
    </header>

    <!-- Offline Alert Banner (Task 3.4) -->
    <div class="banner banner-offline" id="banner-offline">
      <span>⚠️</span>
      <div><strong>Network Offline:</strong> Reconnecting to verify payment status...</div>
    </div>

    <!-- Live Status Banner -->
    <div class="banner banner-status" id="banner-status">
      <span>⚡</span>
      <div id="lbl-status-text">Ready to checkout via UPI or Card</div>
    </div>

    <!-- Dynamic Desktop UPI QR Section (Task 3.2) -->
    <div id="qr-container" style="text-align: center; display: none;">
      <div class="qr-section">
        <img id="qr-image" src="" alt="Scan with UPI App">
      </div>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Scan with Google Pay, PhonePe, Paytm, or BHIM</p>
    </div>

    <!-- Single 1-Click Pay Button (Zero Radio Buttons - Task 3.3) -->
    <button id="btn-pay" class="btn-pay" onclick="handlePayClick()">
      Pay ₹{{AMOUNT_FORMATTED}} Now
    </button>

    <!-- Success Outcome View -->
    <div id="section-success" class="hidden" style="text-align: center; margin-top: 1.5rem;">
      <div style="font-size: 3rem; color: var(--success); margin-bottom: 0.5rem;">✓</div>
      <h4 style="color: #ffffff; margin-bottom: 0.25rem;">Payment Successful!</h4>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Reference: <code id="lbl-payment-id">pay_123456</code></p>
    </div>
  </div>

  <script>
    const orderId = "{{ORDER_ID}}";
    const amountPaise = parseInt("{{AMOUNT_PAISE}}", 10) || 199900;
    const token = "{{TOKEN}}";
    const paymentMode = "{{PAYMENT_MODE}}";
    const keyId = "{{KEY_ID}}" || "rzp_test_arbiter_mock";
    let isProcessing = false;

    // 1. Task 3.3: Auto-open Razorpay Checkout on Mobile
    window.addEventListener("DOMContentLoaded", () => {
      listenToPaymentStatus(token);

      // If mobile, auto-open immediately with zero radio buttons
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        setTimeout(() => {
          handlePayClick();
        }, 300);
      } else {
        // Desktop: Fetch dynamic QR code
        fetchQrCode();
      }
    });

    async function fetchQrCode() {
      try {
        const res = await fetch("/api/recovery/initiate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, preferredMethod: "upi" })
        });
        const data = await res.json();
        if (data.qrDataUrl) {
          document.getElementById("qr-image").src = data.qrDataUrl;
          document.getElementById("qr-container").style.display = "block";
        }
      } catch (e) {}
    }

    // 2. Primary 1-Click Payment Handler
    async function handlePayClick() {
      if (isProcessing) return;
      isProcessing = true;
      const btn = document.getElementById("btn-pay");
      btn.disabled = true;
      btn.innerText = "Opening Checkout...";

      if (paymentMode === "REAL_SANDBOX" || window.Razorpay) {
        openRazorpayCheckout();
      } else {
        // Local deterministic fallback
        simulateLocalPayment();
      }
    }

    function openRazorpayCheckout() {
      const options = {
        key: keyId,
        amount: amountPaise,
        currency: "INR",
        name: "ARBITER Demo Store",
        description: "Order #" + orderId,
        order_id: orderId.startsWith("order_") ? orderId : undefined,
        prefill: {
          name: "Rahul Sharma",
          contact: "+919876543210",
          email: "customer@example.com"
        },
        theme: { color: "#2563eb" },
        handler: async function (response) {
          showPaymentSuccess(response.razorpay_payment_id || "pay_mock_success");
        },
        modal: {
          ondismiss: function () {
            isProcessing = false;
            const btn = document.getElementById("btn-pay");
            btn.disabled = false;
            btn.innerText = "Pay ₹{{AMOUNT_FORMATTED}} Now";
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.on("payment.failed", function (response) {
        handlePaymentFailure(response.error);
      });
      rzp.open();
    }

    async function simulateLocalPayment() {
      try {
        const res = await fetch("/api/charges", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            checkoutToken: token,
            paymentScenario: "LOCAL_SUCCESS",
            instrumentDetails: { type: "upi", upiId: "customer@okhdfcbank" }
          })
        });
        const data = await res.json();
        if (data.executionState === "SUCCEEDED") {
          showPaymentSuccess(data.providerPaymentId || "pay_loc_success");
        } else {
          handlePaymentFailure(data.failureReason || { description: "Payment declined" });
        }
      } catch (err) {
        handlePaymentFailure({ description: "Network connection lost" });
      }
    }

    // 3. Task 3.4: Client-side Offline & Failure Recovery
    window.addEventListener("offline", () => {
      document.getElementById("banner-offline").style.display = "flex";
    });

    window.addEventListener("online", () => {
      document.getElementById("banner-offline").style.display = "none";
      pollStatusWithBackoff();
    });

    function handlePaymentFailure(error) {
      isProcessing = false;
      const btn = document.getElementById("btn-pay");
      btn.disabled = false;
      btn.innerText = "Retry Payment (₹{{AMOUNT_FORMATTED}})";

      if (!navigator.onLine) {
        document.getElementById("banner-offline").style.display = "flex";
        pollStatusWithBackoff();
      } else {
        alert("Payment Error: " + (error?.description || error?.reason || "Declined by bank"));
      }
    }

    function showPaymentSuccess(paymentId) {
      document.getElementById("btn-pay").style.display = "none";
      document.getElementById("qr-container").style.display = "none";
      document.getElementById("banner-status").style.display = "none";
      document.getElementById("lbl-payment-id").innerText = paymentId;
      document.getElementById("section-success").classList.remove("hidden");
    }

    // 4. Real-time Status Synchronization
    function listenToPaymentStatus(tok) {
      if (!tok || tok === "{{TOKEN}}") return;
      const evtSource = new EventSource("/api/status/" + tok);
      evtSource.onmessage = function (event) {
        try {
          const payload = JSON.parse(event.data);
          if (payload.executionState === "SUCCEEDED" || payload.knowledgeStatus === "RESOLVED_SUCCESS") {
            showPaymentSuccess(payload.providerPaymentId || "pay_synced");
            evtSource.close();
          }
        } catch (e) {}
      };
    }

    async function pollStatusWithBackoff() {
      if (!token || token === "{{TOKEN}}") return;
      try {
        const res = await fetch("/api/status/" + token);
        const data = await res.json();
        if (data.executionState === "SUCCEEDED") {
          showPaymentSuccess(data.providerPaymentId);
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
